[package]
name = "rust-model-inference"
version = "0.1.0"
edition = "2021"
description = "Zero-allocation, mmap zero-copy LLM inference engine in pure Rust"
license = "MIT"

[features]
default = []
parity-trace = []
vulkan = ["dep:ash", "dep:raw-window-handle"]
wgpu = ["dep:wgpu"]

[dependencies]
memmap2 = "0.9"
half = "2.4"
rayon = "1.10"
image = "0.25"
ash = { version = "0.37", optional = true }
raw-window-handle = { version = "0.6", optional = true }
bytemuck = "1.0"
wgpu = { version = "29", features = ["spirv"], optional = true }
log = "0.4"
futures = "0.3"
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
rand = "0.8"
unicode_categories = "0.1"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
debug = true

[[bin]]
name = "micro-bench"
path = "src/bin/micro_bench.rs"

[[bin]]
name = "codec_test"
path = "src/bin/codec_test.rs"
