[package]
name = "rust-model-inference"
version = "0.1.0"
edition = "2021"
description = "Zero-allocation, mmap zero-copy LLM inference engine in pure Rust"
license = "MIT"

[features]
default = []
parity-trace = []
vulkan = ["dep:ash", "dep:raw-window-handle"]
wgpu = ["dep:wgpu"]

[dependencies]
memmap2 = "0.9"
half = "2.4"
rayon = "1.10"
image = "0.25"
ash = { version = "0.37", optional = true }
raw-window-handle = { version = "0.6", optional = true }
bytemuck = "1.0"
wgpu = { version = "29", features = ["spirv"], optional = true }
log = "0.4"
env_logger = "0.11"
# Blocking client: image URLs are fetched inside the request handler's
# `spawn_blocking` closure, so an async client would buy nothing.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
futures = "0.3"
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
rand = "0.8"
unicode_categories = "0.1"
sha2 = "0.10"
base64 = "0.22"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
regex = "1.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
debug = true

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
debug = 1

[[bin]]
name = "micro-bench"
path = "src/bin/micro_bench.rs"

[[bin]]
name = "codec_test"
path = "src/bin/codec_test.rs"

[[bin]]
name = "rust-model-server"
path = "src/bin/server.rs"

[[bin]]
name = "dump_meta"
path = "src/bin/dump_meta.rs"

[[bin]]
name = "dump_tensors"
path = "src/bin/dump_tensors.rs"

[[bin]]
name = "dump_dims"
path = "src/bin/dump_dims.rs"

[[bin]]
name = "dump_emb"
path = "src/bin/dump_emb.rs"

[[bin]]
name = "ggufrs"
path = "src/bin/ggufrs.rs"

# Vulkan example binaries are feature-gated: each starts with
# `#![cfg(feature = "vulkan")]`, so without the feature the file is
# empty and `cargo test --examples` complains "main function not found".
# Mark them `required-features` so `cargo build` / `cargo test` skip them
# by default and they only build when the user explicitly opts in via
# `--features vulkan`.
[[example]]
name = "vk_bench"
path = "examples/vk_bench.rs"
required-features = ["vulkan"]

[[example]]
name = "vk_check"
path = "examples/vk_check.rs"
required-features = ["vulkan"]

[[example]]
name = "vk_ops_check"
path = "examples/vk_ops_check.rs"
required-features = ["vulkan"]
